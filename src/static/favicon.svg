<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="mmm-grad-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13151c" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
    <linearGradient id="mmm-grad-stroke" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="mmm-grad-glow" x1="6" y1="38" x2="42" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="1" />
    </linearGradient>
    <filter id="mmm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container Squircle -->
  <rect width="48" height="48" rx="12" fill="url(#mmm-grad-bg)" stroke="#222533" stroke-width="1.5" />

  <!-- Subtle econometric grid line -->
  <line x1="8" y1="38" x2="40" y2="38" stroke="#222533" stroke-width="1.2" stroke-linecap="round" />

  <!-- Dynamic MMM S-Curve & M-Arch (Hill Curve + Growth Vectors) -->
  <!-- Left Ascending Wave -->
  <path d="M 9 36 C 11 26, 14 14, 18 14 C 21 14, 23 26, 24 29 C 25 26, 27 14, 30 14 C 34 14, 37 26, 39 36" 
        stroke="url(#mmm-grad-glow)" 
        stroke-width="3.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#mmm-glow)" />

  <!-- Center Lift / Inflection Points (Econometric Nodes) -->
  <circle cx="18" cy="14" r="2.2" fill="#3b82f6" stroke="#ffffff" stroke-width="1" />
  <circle cx="24" cy="29" r="1.8" fill="#06b6d4" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="30" cy="14" r="2.2" fill="#10b981" stroke="#ffffff" stroke-width="1" />
</svg>
