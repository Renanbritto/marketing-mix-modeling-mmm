<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="240" height="52" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13151c" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
    <linearGradient id="logo-curve" x1="6" y1="38" x2="42" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Emblem -->
  <g transform="translate(2, 2)">
    <!-- Container -->
    <rect width="48" height="48" rx="12" fill="url(#logo-bg)" stroke="#222533" stroke-width="1.5" />
    
    <!-- Base line -->
    <line x1="9" y1="38" x2="39" y2="38" stroke="#222533" stroke-width="1.2" stroke-linecap="round" />

    <!-- Stylized Econometric M Curves -->
    <path d="M 10 36 C 12 26, 14 14, 18 14 C 21 14, 23 26, 24 29 C 25 26, 27 14, 30 14 C 34 14, 36 26, 38 36" 
          stroke="url(#logo-curve)" 
          stroke-width="3.4" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#logo-glow)" />

    <!-- Calibration Nodes -->
    <circle cx="18" cy="14" r="2.2" fill="#3b82f6" stroke="#ffffff" stroke-width="0.9" />
    <circle cx="24" cy="29" r="1.8" fill="#06b6d4" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="30" cy="14" r="2.2" fill="#10b981" stroke="#ffffff" stroke-width="0.9" />
  </g>

  <!-- Typography Lockup -->
  <text x="64" y="24" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="-0.03em">
    MMM <tspan fill="#3b82f6">ENGINE</tspan>
  </text>
  <text x="64" y="39" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="0.08em">
    BUDGET OPTIMIZER
  </text>
</svg>
